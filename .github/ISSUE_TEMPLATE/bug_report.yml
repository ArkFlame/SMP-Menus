name: Bug report
description: Report a reproducible SMPMenus bug.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Exact steps needed to reproduce.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "1.0.2"
    validations:
      required: true

  - type: input
    id: server
    attributes:
      label: Server software and version
      placeholder: "Paper/Folia/Spigot 1.21.1"
    validations:
      required: true

  - type: input
    id: java
    attributes:
      label: Java version
      placeholder: "java -version"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console logs / stack trace
      render: text
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Relevant config/menu YAML
      render: yaml
    validations:
      required: false
